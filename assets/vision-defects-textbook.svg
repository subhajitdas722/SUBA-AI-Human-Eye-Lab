    <text x="8" y="238" class="tiny">Parallel rays</text><path d="M60 95 Q85 145 60 195 Q48 145 60 95 Z" fill="#b9e5f7" stroke="#2877b7" stroke-width="2"/><text x="66" y="218" text-anchor="middle" class="tiny">Toric lens</text><path d="M8 108 L60 108 L120 105 L166 120 L270 145" class="ray"/><path d="M8 182 L60 182 L120 185 L166 170 L270 145" class="ray blue-ray"/>
    <path d="M120 145 C139 76 230 72 278 145 C230 218 139 214 120 145Z" fill="url(#eyefill-astigmatism-true)" stroke="#4e7894" stroke-width="3"/>
    <path d="M120 101 Q96 145 120 189" fill="#b8e8f6" fill-opacity=".75" stroke="#4f8eae" stroke-width="3"/>
    <path d="M149 110 Q174 145 149 180 Q125 145 149 110Z" fill="#9bd7ec" stroke="#377f9f" stroke-width="2.5"/>
    <path d="M255 104 Q278 145 255 186" fill="none" stroke="#b43f45" stroke-width="5"/>
    <path d="M270 145 L320 145" stroke="#e0a34d" stroke-width="9" stroke-linecap="round"/>
    <circle cx="270" cy="145" r="6" class="goodfocus"/><text x="267" y="77" class="tiny" text-anchor="middle">Common retinal focus</text>
    <text x="148" y="205" class="tiny" text-anchor="middle">Eye lens</text>
    <text x="269" y="96" class="tiny" text-anchor="middle">Retina</text>
  </svg>
    </g>
  </g>
<rect x="35" y="1320" width="1530" height="28" rx="7" fill="#f4f0df"/>
<text x="800" y="1340" text-anchor="middle" class="small">Teaching diagrams are schematic and not to scale. Corrective lens power and axis must be determined by an eye examination.</text>
</svg>