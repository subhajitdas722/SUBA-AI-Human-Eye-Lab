    <text x="26" y="39" class="panel-title">2. Hypermetropia (long-sightedness)</text>
    <text x="26" y="94" class="body"><tspan font-weight="bold">Defect: </tspan>Near objects appear blurred; distant vision may be clearer.</text>
    <text x="26" y="139" class="body"><tspan font-weight="bold">Cause: </tspan>The eye has insufficient converging power or the eyeball is shorter; near rays would focus behind the retina.</text>
    <text x="26" y="187" class="body"><tspan font-weight="bold">Correction: </tspan>A convex (converging) lens of suitable power.</text>
    <text x="26" y="222" class="small">The convex lens converges the rays before they enter the eye, helping form the image on the retina.</text>
    <g transform="translate(15,270)">
      <rect width="345" height="260" rx="12" fill="#f5f8fb" stroke="#c7d8e5"/>
      <text x="172" y="28" text-anchor="middle" class="figure-title">(a) Without correction</text>
      <svg x="2" y="25" width="340" height="230" viewBox="0 0 340 250">
