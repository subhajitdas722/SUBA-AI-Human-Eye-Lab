    <circle cx="10" cy="145" r="4" fill="#a94b25"/><text x="10" y="238" text-anchor="middle" class="tiny">Near object</text><path d="M8 145 L120 112 L166 124 L310 145" class="ray"/><path d="M8 145 L120 178 L166 166 L310 145" class="ray"/>
    <path d="M120 145 C139 76 230 72 278 145 C230 218 139 214 120 145Z" fill="url(#eyefill-hypermetropia-false)" stroke="#4e7894" stroke-width="3"/>
