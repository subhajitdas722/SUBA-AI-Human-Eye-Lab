  </g>
<g transform="translate(35,740)">
    <rect width="740" height="560" rx="20" fill="#fffdf7" stroke="#bd4d83" stroke-width="3"/>
    <rect width="740" height="58" rx="18" fill="#a82e69"/>
    <text x="26" y="39" class="panel-title">3. Presbyopia</text>
    <text x="26" y="94" class="body"><tspan font-weight="bold">Defect: </tspan>The near point moves farther away with age, making close work difficult.</text>
    <text x="26" y="139" class="body"><tspan font-weight="bold">Cause: </tspan>Age-related loss of accommodation, mainly due to reduced flexibility of the crystalline lens.</text>
    <text x="26" y="187" class="body"><tspan font-weight="bold">Correction: </tspan>A convex near-add lens; bifocal or progressive lenses may be used when needed.</text>
    <text x="26" y="222" class="small">The added converging power helps focus light from near objects on the retina.</text>
    <g transform="translate(15,270)">
      <rect width="345" height="260" rx="12" fill="#f5f8fb" stroke="#c7d8e5"/>
      <text x="172" y="28" text-anchor="middle" class="figure-title">(a) Without correction</text>
      <svg x="2" y="25" width="340" height="230" viewBox="0 0 340 250">
    <defs><radialGradient id="eyefill-presbyopia-false" cx="45%" cy="45%"><stop offset="0" stop-color="#ffe2b2"/><stop offset=".72" stop-color="#ffc68c"/><stop offset="1" stop-color="#ef9067"/></radialGradient></defs>
    <circle cx="10" cy="145" r="4" fill="#a94b25"/><text x="10" y="238" text-anchor="middle" class="tiny">Near object</text><path d="M8 145 L120 112 L166 124 L310 145" class="ray"/><path d="M8 145 L120 178 L166 166 L310 145" class="ray"/>
    <path d="M120 145 C139 76 230 72 278 145 C230 218 139 214 120 145Z" fill="url(#eyefill-presbyopia-false)" stroke="#4e7894" stroke-width="3"/>
    <path d="M120 101 Q96 145 120 189" fill="#b8e8f6" fill-opacity=".75" stroke="#4f8eae" stroke-width="3"/>
    <path d="M149 110 Q174 145 149 180 Q125 145 149 110Z" fill="#9bd7ec" stroke="#377f9f" stroke-width="2.5"/>
    <path d="M255 104 Q278 145 255 186" fill="none" stroke="#b43f45" stroke-width="5"/>
    <path d="M270 145 L320 145" stroke="#e0a34d" stroke-width="9" stroke-linecap="round"/>
    <circle cx="310" cy="145" r="6" class="badfocus"/><text x="304" y="80" class="tiny" text-anchor="middle">Focus behind retina</text>
    <text x="148" y="205" class="tiny" text-anchor="middle">Eye lens</text>
    <text x="269" y="96" class="tiny" text-anchor="middle">Retina</text>
  </svg>
    </g>
