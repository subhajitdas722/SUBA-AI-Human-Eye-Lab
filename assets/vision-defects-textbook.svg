    <circle cx="10" cy="145" r="4" fill="#a94b25"/><text x="10" y="238" text-anchor="middle" class="tiny">Near object</text><path d="M68 95 Q98 145 68 195 Q38 145 68 95 Z" fill="#b9e5f7" stroke="#2877b7" stroke-width="2"/><text x="68" y="218" text-anchor="middle" class="tiny">Reading lens</text><path d="M8 145 L58 145 L120 111 L166 124 L270 145" class="ray"/><path d="M8 145 L58 145 L120 179 L166 166 L270 145" class="ray"/>
    <path d="M120 145 C139 76 230 72 278 145 C230 218 139 214 120 145Z" fill="url(#eyefill-presbyopia-true)" stroke="#4e7894" stroke-width="3"/>
    <path d="M120 101 Q96 145 120 189" fill="#b8e8f6" fill-opacity=".75" stroke="#4f8eae" stroke-width="3"/>
    <path d="M149 110 Q174 145 149 180 Q125 145 149 110Z" fill="#9bd7ec" stroke="#377f9f" stroke-width="2.5"/>
    <path d="M255 104 Q278 145 255 186" fill="none" stroke="#b43f45" stroke-width="5"/>
    <path d="M270 145 L320 145" stroke="#e0a34d" stroke-width="9" stroke-linecap="round"/>
    <circle cx="270" cy="145" r="6" class="goodfocus"/><text x="267" y="77" class="tiny" text-anchor="middle">Focus on retina</text>
    <text x="148" y="205" class="tiny" text-anchor="middle">Eye lens</text>
    <text x="269" y="96" class="tiny" text-anchor="middle">Retina</text>
  </svg>
    </g>
  </g>
<g transform="translate(825,740)">
    <rect width="740" height="560" rx="20" fill="#fffdf7" stroke="#258a75" stroke-width="3"/>
    <rect width="740" height="58" rx="18" fill="#08745f"/>
    <text x="26" y="39" class="panel-title">4. Astigmatism</text>
    <text x="26" y="94" class="body"><tspan font-weight="bold">Defect: </tspan>Vision may be blurred or distorted because two principal meridians do not share one focus.</text>
    <text x="26" y="139" class="body"><tspan font-weight="bold">Cause: </tspan>The cornea, or sometimes the lens, has unequal curvature and refractive power in different meridians.</text>
    <text x="26" y="187" class="body"><tspan font-weight="bold">Correction: </tspan>A cylindrical or toric lens, selected for the individual eye.</text>
    <text x="26" y="222" class="small">The lens compensates for unequal meridional power so the two focal lines are brought together appropriately.</text>
    <g transform="translate(15,270)">
      <rect width="345" height="260" rx="12" fill="#f5f8fb" stroke="#c7d8e5"/>
      <text x="172" y="28" text-anchor="middle" class="figure-title">(a) Without correction</text>
      <svg x="2" y="25" width="340" height="230" viewBox="0 0 340 250">
    <defs><radialGradient id="eyefill-astigmatism-false" cx="45%" cy="45%"><stop offset="0" stop-color="#ffe2b2"/><stop offset=".72" stop-color="#ffc68c"/><stop offset="1" stop-color="#ef9067"/></radialGradient></defs>
    <text x="8" y="238" class="tiny">Parallel rays</text><path d="M8 108 L120 108 L166 124 L218 145" class="ray"/><path d="M8 182 L120 182 L166 166 L312 145" class="ray blue-ray"/>
    <path d="M120 145 C139 76 230 72 278 145 C230 218 139 214 120 145Z" fill="url(#eyefill-astigmatism-false)" stroke="#4e7894" stroke-width="3"/>
    <path d="M120 101 Q96 145 120 189" fill="#b8e8f6" fill-opacity=".75" stroke="#4f8eae" stroke-width="3"/>
    <path d="M149 110 Q174 145 149 180 Q125 145 149 110Z" fill="#9bd7ec" stroke="#377f9f" stroke-width="2.5"/>
    <path d="M255 104 Q278 145 255 186" fill="none" stroke="#b43f45" stroke-width="5"/>
    <path d="M270 145 L320 145" stroke="#e0a34d" stroke-width="9" stroke-linecap="round"/>
    <circle cx="218" cy="145" r="6" class="badfocus"/><circle cx="312" cy="145" r="6" class="bluefocus"/><text x="218" y="80" class="tiny" text-anchor="middle">Focal line 1</text><text x="302" y="98" class="tiny" text-anchor="middle">Focal line 2</text>
    <text x="148" y="205" class="tiny" text-anchor="middle">Eye lens</text>
    <text x="269" y="96" class="tiny" text-anchor="middle">Retina</text>
  </svg>
