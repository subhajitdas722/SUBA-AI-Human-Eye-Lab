<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1360" role="img" aria-labelledby="title desc">
<title id="title">Defects of vision and their correction</title>
<desc id="desc">Textbook-style reference showing myopia, hypermetropia, presbyopia and astigmatism, with diagrams before and after correction and the appropriate corrective lenses.</desc>
<defs>
  <style>
    .page-title{font: bold 42px Georgia,serif;fill:#fff}.subtitle{font:18px Georgia,serif;fill:#25435c}
    .panel-title{font:bold 25px Georgia,serif;fill:#fff}.body{font:17px Georgia,serif;fill:#243746}
    .small{font:14px Georgia,serif;fill:#465b6b}.figure-title{font:bold 16px Georgia,serif;fill:#234b6b}
    .tiny{font:11px Georgia,serif;fill:#304b5f}.ray{stroke:#d73535;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .blue-ray{stroke:#257dbb;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .goodfocus{fill:#159a75;stroke:#fff;stroke-width:2}.badfocus{fill:#d64e42;stroke:#fff;stroke-width:2}.bluefocus{fill:#2678b7;stroke:#fff;stroke-width:2}
  </style>
  <linearGradient id="header" x2="1" y2="1"><stop stop-color="#164f87"/><stop offset="1" stop-color="#0b2e5b"/></linearGradient>
