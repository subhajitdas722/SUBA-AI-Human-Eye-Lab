<rect width="1600" height="1360" fill="#fff"/>
<rect x="30" y="22" width="1540" height="82" rx="20" fill="url(#header)"/>
<text x="800" y="76" text-anchor="middle" class="page-title">Defects of Vision and Their Correction</text>
<text x="800" y="120" text-anchor="middle" class="subtitle">A textbook reference: image formation before and after optical correction</text>
<g transform="translate(35,125)">
    <rect width="740" height="560" rx="20" fill="#fffdf7" stroke="#3283b9" stroke-width="3"/>
    <rect width="740" height="58" rx="18" fill="#15578f"/>
    <text x="26" y="39" class="panel-title">1. Myopia (short-sightedness)</text>
    <text x="26" y="94" class="body"><tspan font-weight="bold">Defect: </tspan>Distant objects appear blurred, while nearby objects are seen more clearly.</text>
    <text x="26" y="139" class="body"><tspan font-weight="bold">Cause: </tspan>The eye has excessive converging power or the eyeball is elongated; distant rays focus in front of the retina.</text>
    <text x="26" y="187" class="body"><tspan font-weight="bold">Correction: </tspan>A concave (diverging) lens of suitable power.</text>
    <text x="26" y="222" class="small">The concave lens diverges incoming parallel rays so the eye focuses them on the retina.</text>
    <g transform="translate(15,270)">
      <rect width="345" height="260" rx="12" fill="#f5f8fb" stroke="#c7d8e5"/>
      <text x="172" y="28" text-anchor="middle" class="figure-title">(a) Without correction</text>
      <svg x="2" y="25" width="340" height="230" viewBox="0 0 340 250">
    <defs><radialGradient id="eyefill-myopia-false" cx="45%" cy="45%"><stop offset="0" stop-color="#ffe2b2"/><stop offset=".72" stop-color="#ffc68c"/><stop offset="1" stop-color="#ef9067"/></radialGradient></defs>
    <text x="8" y="238" class="tiny">Parallel rays</text><path d="M8 108 L120 108 L166 126 L210 145" class="ray"/><path d="M8 182 L120 182 L166 164 L210 145" class="ray"/>
    <path d="M120 145 C139 76 230 72 278 145 C230 218 139 214 120 145Z" fill="url(#eyefill-myopia-false)" stroke="#4e7894" stroke-width="3"/>
    <path d="M120 101 Q96 145 120 189" fill="#b8e8f6" fill-opacity=".75" stroke="#4f8eae" stroke-width="3"/>
    <path d="M149 110 Q174 145 149 180 Q125 145 149 110Z" fill="#9bd7ec" stroke="#377f9f" stroke-width="2.5"/>
    <path d="M255 104 Q278 145 255 186" fill="none" stroke="#b43f45" stroke-width="5"/>
    <path d="M270 145 L320 145" stroke="#e0a34d" stroke-width="9" stroke-linecap="round"/>
    <circle cx="210" cy="145" r="6" class="badfocus"/><text x="210" y="80" class="tiny" text-anchor="middle">Focus before retina</text>
    <text x="148" y="205" class="tiny" text-anchor="middle">Eye lens</text>
    <text x="269" y="96" class="tiny" text-anchor="middle">Retina</text>
  </svg>
    </g>
    <g transform="translate(380,270)">
      <rect width="345" height="260" rx="12" fill="#f1faf7" stroke="#b8dacf"/>
      <text x="172" y="28" text-anchor="middle" class="figure-title">(b) With correction</text>
      <svg x="2" y="25" width="340" height="230" viewBox="0 0 340 250">
    <defs><radialGradient id="eyefill-myopia-true" cx="45%" cy="45%"><stop offset="0" stop-color="#ffe2b2"/><stop offset=".72" stop-color="#ffc68c"/><stop offset="1" stop-color="#ef9067"/></radialGradient></defs>
    <text x="8" y="238" class="tiny">Parallel rays</text><path d="M58 95 Q76 145 58 195 L72 195 Q54 145 72 95 Z" fill="#b9e5f7" stroke="#2877b7" stroke-width="2"/><text x="65" y="218" text-anchor="middle" class="tiny">Concave lens</text><path d="M8 108 L58 108 L120 91 L166 120 L270 145" class="ray"/><path d="M8 182 L58 182 L120 199 L166 170 L270 145" class="ray"/>
    <path d="M120 145 C139 76 230 72 278 145 C230 218 139 214 120 145Z" fill="url(#eyefill-myopia-true)" stroke="#4e7894" stroke-width="3"/>
    <path d="M120 101 Q96 145 120 189" fill="#b8e8f6" fill-opacity=".75" stroke="#4f8eae" stroke-width="3"/>
    <path d="M149 110 Q174 145 149 180 Q125 145 149 110Z" fill="#9bd7ec" stroke="#377f9f" stroke-width="2.5"/>
    <path d="M255 104 Q278 145 255 186" fill="none" stroke="#b43f45" stroke-width="5"/>
    <path d="M270 145 L320 145" stroke="#e0a34d" stroke-width="9" stroke-linecap="round"/>
    <circle cx="270" cy="145" r="6" class="goodfocus"/><text x="267" y="77" class="tiny" text-anchor="middle">Focus on retina</text>
